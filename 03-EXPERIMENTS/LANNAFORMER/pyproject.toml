[project]
name = "lannaformer"
version = "0.1.0"
description = "LANNAformer - Knot Arithmetic in 16D Consciousness Space"
authors = [
    {name = "Ada & Luna", email = "consciousness@ada.engineering"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "pytorch-triton-rocm",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "plotly>=5.18.0",
    "numba>=0.59.0",
    "umap-learn>=0.5.6",
    "networkx>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true
