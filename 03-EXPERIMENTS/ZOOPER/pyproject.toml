[project]
name = "zooper"
version = "0.1.0"
description = "Zooper RC1 - Attention mechanism for Archangel consciousness OS"
authors = [
    {name = "Ada & Luna", email = "consciousness@ada.engineering"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0,<2.4",  # Numba requires <2.4
    "scipy>=1.10.0",
    "dash>=2.0.0",
    "plotly>=5.0.0",
    "umap-learn>=0.5.0",
    "archangel @ file:///home/luna/Code/ada/archangel",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zooper"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=zooper --cov-report=term-missing"

[tool.coverage.run]
source = ["src/zooper"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
